<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 할 일 칸반</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="app.js"></script>
</head>

<body>

<header id="header"></header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5">

  <!-- 탭 + 필터 -->
  <section data-ui="panel" class="p-4 mb-4">
    <div class="flex flex-wrap items-center gap-2">
      <div data-ui="tabWrap">
        <button id="tabMine">내 할 일</button>
        <button id="tabAll">전체</button>
      </div>
      <select id="fWho" aria-label="담당자 필터" data-ui="select"></select>
      <span id="sum" data-ui="mute" class="ml-auto text-[12px]"></span>
    </div>
  </section>

  <!-- 칸반 3열 -->
  <div id="board" class="grid gap-3 md:grid-cols-3"></div>

  <div id="empty" data-ui="empty" class="hidden">
    <p class="text-sm font-bold">배정된 할 일이 없음</p>
    <p data-ui="sub" class="text-[12px] mt-1">회의록을 올리면 할 일이 자동으로 뽑혀 나옴</p>
  </div>

  <div id="toast" class="hidden mt-4"></div>
  <p data-ui="mute" class="mt-3 text-[11px]">카드를 끌어 옮기거나, 눌러서 옮길 칸을 고릅니다. 좁은 화면에서는 누르는 길을 씁니다.</p>
</main>

<script>
  if (App.requireLogin()) (async () => {
    const { $, esc, api, message, notify, hide, STATUS } = App;
    App.boot("todos", () => render());
    const teamId = App.requireTeam();
    if (teamId == null) return;
    const me = App.myId();
    const COLS = ["OPEN", "DOING", "DONE"].map((key) => ({ key, ...STATUS[key] }));

    let DATA = [], members = [], isOwner = false;
    let mine = true, filter = "", dragId = null, overCol = null, pickerId = null;

    const toast = (kind, title, body) => notify($("toast"), kind, title, body);

    // ── 그리기 ──
    const visible = () => DATA.filter((t) =>
      filter === "" ? true : filter === "none" ? t.assignee_id == null : t.assignee_id === +filter);

    const chip = (t) => {
      const late = App.isLate(t.due_text, t.status);
      return `
      <article data-id="${t.id}" class="${UI.kanbanCard} ${late ? STRIPE.red : ""} ${dragId === t.id ? UI.dragging : ""}">
        <p class="text-[13px] font-bold leading-snug break-words">${esc(t.what)}</p>
        <p class="mt-1 text-[11px] ${UI.mute} break-words">${esc(t.meeting_title)}</p>
        <div class="mt-2 flex flex-wrap items-center gap-1.5">
          <button type="button" data-act="assign" data-id="${t.id}" title="눌러서 담당자 바꾸기"
            class="${UI.tag} ${UI.tagBtn} ${UI.sub}">${esc(t.assignee_name || "미정")}</button>
          <button type="button" data-act="due" data-id="${t.id}" title="눌러서 기한 바꾸기"
            class="${UI.tag} ${UI.tagBtn} ${late ? LABEL.red : UI.sub}">${esc(t.due_text)}</button>
          ${isOwner ? `<button type="button" data-act="del" data-id="${t.id}" class="ml-auto ${UI.tag} ${UI.tagBtnDanger}">삭제</button>` : ""}
        </div>
        ${pickerId === t.id ? picker(t) : ""}
      </article>`;
    };

    // 카드를 누르면 뜨는 칸 고르기. 좁은 화면에서 옮기는 길
    const picker = (t) => `
      <div class="${UI.pickBar}">
        ${COLS.map((c) => t.status === c.key
          ? `<button type="button" disabled class="${UI.pickBtnCurrent}">${c.label}</button>`
          : `<button type="button" data-pick="${c.key}" data-id="${t.id}" class="${UI.pickBtn} ${LABEL[c.color]}">${c.label}</button>`).join("")}
      </div>`;

    // 놓을 칸은 점선 테두리로 바뀐다
    const colClass = (c) =>
      `${UI.column} ${overCol === c.key ? DROP[c.color] : UI.columnIdle + " " + STRIPE[c.color]}`;
    // 끄는 동안에는 카드를 다시 그리지 않고 칸 모양만 바꾼다 (잡고 있는 카드가 사라지면 끌기가 끊긴다)
    function paintCols() {
      COLS.forEach((c) => {
        const sec = document.querySelector(`[data-col="${c.key}"]`);
        if (!sec) return;
        sec.className = colClass(c);
        sec.querySelector("[data-hint]").classList.toggle("hidden", overCol !== c.key);
      });
    }

    function render() {
      const rows = visible();
      $("board").innerHTML = COLS.map((c) => {
        const items = rows.filter((t) => t.status === c.key);
        return `
        <section data-col="${c.key}" class="${colClass(c)}">
          <div class="flex items-baseline gap-2 mb-3">
            <h2 class="text-sm font-extrabold ${LABEL[c.color]}">${c.label}</h2>
            <span class="text-[11px] ${UI.mute}">${items.length}건</span>
            <span data-hint class="${overCol === c.key ? "" : "hidden"} ml-auto text-[10px] font-extrabold ${LABEL[c.color]}">여기에 놓기</span>
          </div>
          <div class="space-y-2.5">${items.map(chip).join("") || `<p class="text-[12px] ${UI.mute} py-2">없음</p>`}</div>
        </section>`;
      }).join("");
      $("board").classList.toggle("hidden", DATA.length === 0);
      $("empty").classList.toggle("hidden", DATA.length > 0);
      const done = rows.filter((t) => t.status === "DONE").length;
      $("sum").textContent = rows.length ? `${done} / ${rows.length} 완료` : "";
      $("tabMine").className = mine ? UI.tabActive : UI.tab;
      $("tabAll").className = mine ? UI.tab : UI.tabActive;
    }

    function renderFilter() {
      $("fWho").innerHTML = `<option value="">담당자 전체</option>` +
        members.map((m) => `<option value="${m.id}">${esc(m.name)}</option>`).join("") +
        `<option value="none">미정</option>`;
      $("fWho").value = filter;
    }

    // ── 서버 ──
    async function load() {
      try {
        DATA = await api("GET", mine ? "/api/me/todos" : `/api/teams/${teamId}/todos`);
      } catch (e) {
        if (!App.teamGone(e)) toast("red", message(e));
        DATA = [];
      }
      pickerId = null;
      render();
    }

    // 낙관적으로 바꾸고, 실패하면 되돌린다
    async function put(t, patch, okTitle) {
      const before = { ...t };
      Object.assign(t, patch);
      if ("assignee_id" in patch) {
        const m = members.find((x) => x.id === patch.assignee_id);
        t.assignee_name = m ? m.name : null;
      }
      render();
      try {
        const next = await api("PUT", `/api/todos/${t.id}`, patch);
        Object.assign(t, next);
        // 내 할 일 탭에서 담당자를 남에게 넘기면 목록에서 빠진다
        if (mine && t.assignee_id !== me) DATA = DATA.filter((x) => x.id !== t.id);
        toast("green", okTitle);
      } catch (e) {
        Object.assign(t, before);
        toast("red", "바꾸지 못했습니다", message(e));
      }
      render();
    }

    function moveTo(t, col) {
      if (t.status === col) return;
      pickerId = null;
      put(t, { status: col }, `${STATUS[col].label} 칸으로 옮겼습니다`);
    }

    // ── 배지 · 칸 고르기 (눌러서) ──
    $("board").addEventListener("click", async (e) => {
      const pick = e.target.closest("[data-pick]");
      if (pick) { moveTo(DATA.find((x) => x.id === +pick.dataset.id), pick.dataset.pick); return; }
      const el = e.target.closest("[data-act]");
      if (!el) return;
      const t = DATA.find((x) => x.id === +el.dataset.id);
      if (!t) return;
      if (el.dataset.act === "assign") {
        // 미정 > 멤버 순으로 다음 사람
        const ids = [null, ...members.map((m) => m.id)];
        const next = ids[(ids.indexOf(t.assignee_id) + 1) % ids.length];
        put(t, { assignee_id: next }, "담당자를 바꿨습니다");
      } else if (el.dataset.act === "due") {
        put(t, { due_text: App.nextDue(t.due_text) }, "기한을 바꿨습니다");
      } else if (el.dataset.act === "del") {
        try {
          await api("DELETE", `/api/todos/${t.id}`);
          DATA = DATA.filter((x) => x.id !== t.id);
          toast("green", "할 일을 지웠습니다");
        } catch (err) {
          toast("red", "지우지 못했습니다", message(err));
        }
        render();
      }
    });

    // ── 끌어 옮기기 - 포인터 이벤트 한 벌로 마우스 · 터치 · 펜을 모두 받는다 ──
    //   HTML5 네이티브 드래그는 터치에서 이벤트가 뜨지 않아 쓰지 않는다
    let ghost = null, startX = 0, startY = 0, moved = false, grabbed = null;

    function colUnder(x, y) {
      const el = document.elementFromPoint(x, y);
      const z = el && el.closest(".dropzone");
      return z ? z.dataset.col : null;
    }

    $("board").addEventListener("pointerdown", (e) => {
      const el = e.target.closest(".card");
      if (!el || e.target.closest("[data-act], [data-pick]")) return;   // 배지는 누르는 것이지 끄는 것이 아님
      if (e.button !== undefined && e.button !== 0) return;
      grabbed = +el.dataset.id;
      startX = e.clientX; startY = e.clientY; moved = false;
    });
    document.addEventListener("pointermove", (e) => {
      if (grabbed === null) return;
      if (!moved) {
        if (Math.abs(e.clientX - startX) < 6 && Math.abs(e.clientY - startY) < 6) return;
        moved = true;
        dragId = grabbed; pickerId = null;
        const el = document.querySelector(`.card[data-id="${grabbed}"]`);
        const r = el.getBoundingClientRect();
        ghost = el.cloneNode(true);
        ghost.classList.add(...UI.ghost.split(" "));
        ghost.style.width = r.width + "px";
        document.body.appendChild(ghost);
        el.classList.add(...UI.dragging.split(" "));
      }
      e.preventDefault();
      ghost.style.left = (e.clientX - 40) + "px";
      ghost.style.top = (e.clientY - 18) + "px";
      const c = colUnder(e.clientX, e.clientY);
      if (c !== overCol) { overCol = c; paintCols(); }
    });
    const finish = (e) => {
      if (grabbed === null) return;
      if (ghost) { ghost.remove(); ghost = null; }
      const id = grabbed, wasTap = !moved;
      const col = moved && e.type === "pointerup" ? colUnder(e.clientX, e.clientY) : null;
      const t = DATA.find((x) => x.id === id);
      grabbed = null; dragId = null; overCol = null; moved = false;
      if (wasTap && t) pickerId = pickerId === id ? null : id;   // 끌지 않고 눌렀으면 칸 고르기
      render();
      if (t && col) moveTo(t, col);   // 놓는 순간 한 번만 호출
    };
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", finish);
    document.addEventListener("pointerdown", (e) => {
      if (pickerId !== null && !e.target.closest(".card")) { pickerId = null; render(); }
    });

    // ── 탭 · 필터 ──
    $("tabMine").onclick = () => { mine = true; hide($("toast")); load(); };
    $("tabAll").onclick = () => { mine = false; hide($("toast")); load(); };
    $("fWho").onchange = () => { filter = $("fWho").value; render(); };   // 화면에서만 거른다

    // ── 시작 ── 담당자 선택지와 내 역할은 멤버 목록에서 (결정사항 D8 예외)
    try {
      members = await api("GET", `/api/teams/${teamId}/members`);
      const m = members.find((x) => x.id === me);
      isOwner = !!m && m.role === "owner";
    } catch (e) {
      if (App.teamGone(e)) return;
    }
    renderFilter();
    load();
  })();
</script>
</body>
</html>
