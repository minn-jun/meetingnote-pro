<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 팀 설정</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
<script src="app.js"></script>
</head>

<body>

<header id="header"></header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5 space-y-4">

  <div id="pageMsg" class="hidden"></div>

  <!-- 팀 만들기 / 합류 (소속 팀이 없을 때) -->
  <section id="onboard" data-ui="panel" data-stripe="purple" class="hidden p-5">
    <h1 class="text-lg font-extrabold">아직 소속 팀이 없음</h1>
    <p data-ui="sub" class="text-[13px] mt-1">팀을 새로 만들거나, 받은 초대코드로 합류</p>
    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      <form id="createForm" data-ui="item" class="p-4">
        <label for="newName" class="block text-[13px] font-extrabold mb-2">팀 만들기</label>
        <input id="newName" data-ui="inputOnChip" placeholder="팀 이름" maxlength="100">
        <button id="createBtn" type="submit" data-ui="btnPrimary" class="mt-2.5 w-full">만들기</button>
      </form>
      <form id="joinForm" data-ui="item" class="p-4">
        <label for="joinCode" class="block text-[13px] font-extrabold mb-2">초대코드로 합류</label>
        <input id="joinCode" data-ui="inputOnChip" class="font-mono tracking-widest" placeholder="MN-7K2D">
        <button id="joinBtn" type="submit" data-ui="btnOnChip" class="mt-2.5 w-full">합류</button>
      </form>
    </div>
    <div id="joinErr" class="hidden mt-3"></div>
  </section>

  <div id="teamView" class="hidden space-y-4">
    <!-- 팀 정보 -->
    <section data-ui="panel" class="p-5">
      <div class="flex flex-wrap items-start gap-4">
        <div class="flex-1 min-w-[200px]">
          <label for="tName" data-ui="mute" class="block text-[11px] font-bold mb-1">팀 이름</label>
          <input id="tName" data-ui="input" class="font-bold" maxlength="100">
          <button id="saveName" type="button" data-ui="btnPrimary" class="mt-2">이름 저장</button>
        </div>
        <div>
          <p data-ui="mute" class="text-[11px] font-bold mb-1">초대코드</p>
          <div class="flex flex-wrap gap-2">
            <div id="code" data-ui="codeBox"></div>
            <button id="copyBtn" data-ui="btnGhost">복사</button>
            <button id="newCodeBtn" data-ui="btnGhost">재발급</button>
          </div>
        </div>
      </div>
      <p id="roleNote" data-ui="mute" class="mt-3 text-[11px]"></p>
      <div id="codeMsg" class="hidden mt-3"></div>
    </section>

    <!-- 멤버 -->
    <section data-ui="panel" class="p-5">
      <div class="flex items-baseline gap-2 mb-3">
        <h2 class="text-sm font-extrabold">멤버 <span id="mCap" data-ui="mute" class="font-bold"></span></h2>
        <span data-ui="mute" class="ml-auto text-[11px]">팀당 6명 이내</span>
      </div>
      <ul id="members" class="grid gap-2 sm:grid-cols-2"></ul>
    </section>

    <!-- 활동 기록 -->
    <section data-ui="panel" class="p-5">
      <div class="flex items-baseline gap-2 mb-3">
        <h2 class="text-sm font-extrabold">활동 기록</h2>
        <span data-ui="mute" class="text-[11px]">최근 순</span>
      </div>
      <ol id="acts" class="space-y-2.5"></ol>
      <p id="actsEmpty" data-ui="mute" class="hidden text-[12px]">아직 활동이 없음</p>
    </section>
  </div>
</main>

<script>
  if (App.requireLogin()) (async () => {
    const { $, esc, api, message, notify, hide } = App;
    App.boot("team");
    let team = null;

    const msg = (kind, title, body) => notify($("codeMsg"), kind, title, body);

    function renderTeam() {
      const owner = team.role === "owner";
      $("tName").value = team.name;
      $("code").textContent = team.invite_code;
      $("teamName").textContent = team.name;
      // member 는 읽기만. owner 전용은 팀 이름 변경 · 초대코드 재발급
      $("tName").readOnly = !owner;
      $("tName").classList.toggle("opacity-60", !owner);
      [$("saveName"), $("newCodeBtn"), $("copyBtn")].forEach((b) => {
        b.disabled = !owner;
        App.toggleUI(b, "locked", !owner);
      });
      $("roleNote").textContent = owner
        ? "팀 이름 변경과 초대코드 재발급은 owner 만 할 수 있음"
        : "member 로 들어와 읽기만 가능. 팀 이름 변경과 초대코드 재발급은 owner 만";
    }

    async function loadMembers() {
      const rows = await api("GET", `/api/teams/${team.id}/members`);
      $("mCap").textContent = `${rows.length} / 6`;
      $("members").innerHTML = rows.map((m) => `
        <li class="${UI.item} p-3 flex items-center gap-3">
          <div class="${UI.avatar}">${esc(m.name[0] || "?")}</div>
          <div class="flex-1 min-w-0">
            <p class="text-[13px] font-bold truncate">${esc(m.name)}</p>
            <p class="text-[11px] ${UI.mute} truncate">${esc(m.email)}</p>
          </div>
          <div class="text-right shrink-0">
            <span class="${UI.tagOnChip} font-extrabold ${m.role === "owner" ? LABEL.purple : UI.sub}">${m.role}</span>
            <p class="mt-1 text-[10px] ${UI.mute}">할 일 ${m.todo_count}</p>
          </div>
        </li>`).join("");
    }

    async function loadActs() {
      const rows = await api("GET", `/api/teams/${team.id}/activities`);
      $("acts").innerHTML = rows.map((a) => `
        <li class="${UI.item} ${STRIPE[App.KIND_COLOR[a.kind] || "purple"]} px-3.5 py-2.5">
          <p class="text-[13px] break-words"><span class="font-bold">${esc(a.actor_name)}</span>  ·  ${esc(a.text)}</p>
          <p class="text-[11px] ${UI.mute} mt-0.5">${App.fmtWhen(a.created_at)}</p>
        </li>`).join("");
      $("actsEmpty").classList.toggle("hidden", rows.length > 0);
    }

    async function show() {
      hide($("pageMsg"));
      let teams;
      try { teams = await api("GET", "/api/teams"); }
      catch (e) { notify($("pageMsg"), "red", message(e)); return; }
      team = teams[0] || null;
      $("onboard").classList.toggle("hidden", !!team);
      $("teamView").classList.toggle("hidden", !team);
      if (!team) { App.setTeam(null); $("teamName").textContent = ""; return; }
      App.setTeam(team.id, team.name);
      renderTeam();
      try { await Promise.all([loadMembers(), loadActs()]); }
      catch (e) { notify($("pageMsg"), "red", message(e)); }
    }

    // ── 팀 만들기 · 합류 ──
    $("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hide($("joinErr"));
      const name = $("newName").value.trim();
      if (!name) { notify($("joinErr"), "red", "팀 이름을 입력해 주세요"); return; }
      $("createBtn").disabled = true;
      try { await api("POST", "/api/teams", { name }); await show(); }
      catch (err) { notify($("joinErr"), "red", message(err)); }
      $("createBtn").disabled = false;
    });
    $("joinForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      hide($("joinErr"));
      const code = $("joinCode").value.trim();
      if (!code) { notify($("joinErr"), "red", "초대코드를 입력해 주세요"); return; }
      $("joinBtn").disabled = true;
      try { await api("POST", "/api/teams/join", { code }); await show(); }
      catch (err) {
        // 코드가 틀려도 가입 계정은 그대로 유지
        notify($("joinErr"), "red", message(err), err.code === "INVITE_NOT_FOUND" ? "코드를 다시 확인해 주세요" : "");
      }
      $("joinBtn").disabled = false;
    });

    // ── 팀 정보 ──
    $("saveName").onclick = async () => {
      const name = $("tName").value.trim();
      if (!name) { msg("red", "팀 이름을 입력해 주세요"); return; }
      $("saveName").disabled = true;
      try {
        team = await api("PUT", `/api/teams/${team.id}`, { name });
        App.setTeam(team.id, team.name);
        renderTeam();
        msg("green", "팀 이름을 저장했습니다");
      } catch (e) { msg("red", message(e)); }
      $("saveName").disabled = team.role !== "owner";
    };
    $("copyBtn").onclick = async () => {
      try {
        await navigator.clipboard.writeText(team.invite_code);
        msg("green", "초대코드를 복사했습니다", "받는 사람은 회원가입 화면의 초대코드 칸에 붙여넣으면 됩니다");
      } catch (e) {
        msg("orange", "복사하지 못했습니다", `코드 ${team.invite_code} 를 직접 적어 전해 주세요`);
      }
    };
    $("newCodeBtn").onclick = async () => {
      const old = team.invite_code;
      $("newCodeBtn").disabled = true;
      try {
        team = await api("PUT", `/api/teams/${team.id}/code`);
        renderTeam();
        msg("orange", "초대코드를 다시 발급했습니다", `앞의 코드 ${old} 는 더 쓸 수 없습니다. 이미 합류한 멤버는 그대로입니다`);
      } catch (e) { msg("red", message(e)); }
      $("newCodeBtn").disabled = team.role !== "owner";
    };

    show();
  })();
</script>
</body>
</html>
